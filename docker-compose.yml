services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: nhs_pulse_db
      POSTGRES_USER: nhs_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
    ports: ['127.0.0.1:5546:5432']
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U nhs_admin -d nhs_pulse_db']
      interval: 5s
      retries: 20
  migrate:
    build: {context: .,dockerfile: infra/api.Dockerfile}
    env_file: .env
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://nhs_admin:${POSTGRES_PASSWORD}@postgres:5432/nhs_pulse_db
    command: ['uv','run','--no-sync','python','-m','tools.migrate']
    depends_on: {postgres: {condition: service_healthy}}
  api:
    build: {context: .,dockerfile: infra/api.Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://nhs_app:${APP_DATABASE_PASSWORD}@postgres:5432/nhs_pulse_db
      WORKER_DATABASE_URL: postgresql+psycopg://nhs_worker:${APP_DATABASE_PASSWORD}@postgres:5432/nhs_pulse_db
    ports: ['127.0.0.1:8020:8020']
    volumes: ['raw:/app/.local/raw']
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: ['CMD','uv','run','--no-sync','python','-c',"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8020/health/ready')"]
      interval: 30s
      start_period: 30s
  worker:
    build: {context: .,dockerfile: infra/api.Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://nhs_app:${APP_DATABASE_PASSWORD}@postgres:5432/nhs_pulse_db
      WORKER_DATABASE_URL: postgresql+psycopg://nhs_worker:${APP_DATABASE_PASSWORD}@postgres:5432/nhs_pulse_db
    command: ['uv','run','--no-sync','python','-m','pipelines.orchestration.scheduler']
    volumes: ['raw:/app/.local/raw']
    depends_on: {migrate: {condition: service_completed_successfully}}
  web:
    build: {context: .,dockerfile: infra/web.Dockerfile}
    environment: {API_INTERNAL_URL: 'http://api:8020'}
    ports: ['127.0.0.1:3020:3020']
    depends_on: {api: {condition: service_healthy}}
volumes:
  pgdata:
  raw:
