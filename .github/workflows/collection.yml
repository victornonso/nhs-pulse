name: Official publication discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions: {contents: read}
concurrency: {group: nhs-source-discovery,cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.NHS_READER_DATABASE_URL }}
      WORKER_DATABASE_URL: ${{ secrets.NHS_WORKER_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.NHS_WORKER_DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.NHS_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        id: configuration
        run: |
          if [ -n "$WORKER_DATABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Collection deployment is not connected; no source freshness was changed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.configuration.outputs.ready == 'true'
      - run: uv sync --frozen --no-dev
        if: steps.configuration.outputs.ready == 'true'
      - name: Source-specific due checks and collection
        if: steps.configuration.outputs.ready == 'true'
        run: uv run python -m tools.scheduled_collection
